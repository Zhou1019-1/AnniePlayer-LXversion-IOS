name: 构建入口保护（尚未配置）

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unavailable:
    name: 拒绝虚假构建
    runs-on: ubuntu-latest
    steps:
      - name: 说明当前不可构建
        run: |
          echo "::error::当前仓库尚无真实 iOS 应用工程，未配置构建、签名或发布能力。"
          echo "请先通过 PR 提交并评审真实工程及对应 workflow；本保护流程不会生成 Artifact 或 Release。"
          exit 1
