name: 交付入口保护（尚未配置）

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unavailable:
    name: 拒绝虚假交付
    runs-on: ubuntu-latest
    steps:
      - name: 说明当前不可交付
        run: |
          echo "::error::当前仓库没有可交付的 iOS 构建产物，未配置 Draft Release 或正式发布能力。"
          echo "真实工程落地后的交付必须经 PR、owner 批准及最终核验；本保护流程不会创建 tag 或 Release。"
          exit 1
